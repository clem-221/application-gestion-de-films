<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>{{ movies|length }} movies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .badge {
            background-color: #28a745;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
        }

        .movie-card {
            display: flex;
            background: white;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .movie-card img {
            width: 130px;
            height: 190px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #ddd;
        }

        .movie-info {
            padding: 15px 20px;
            flex: 1;
        }

        .movie-info h2 {
            margin: 0 0 10px 0;
        }

        .movie-info p {
            margin: 4px 0;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="badge">{{ movies|length }}</span>
        <h1>movies</h1>
    </div>

    {% for movie in movies %}
    <div class="movie-card">
        <img src="{{ movie.cover }}" alt="{{ movie.title }}"
            onerror="this.onerror=null; this.src='https://placehold.co/130x190?text=No+Image';">
        <div class="movie-info">
            <h2>{{ movie.title }}</h2>
            <p>{{ movie.extract }}</p>
            <p>{{ movie.year }}</p>
            <p>{{ movie.genres }}</p>
            <a href="https://www.google.fr/search?q={{ movie.title | urlencode }}" target="_blank" class="btn">
                Search
            </a>
        </div>
    </div>
    {% endfor %}
</body>

</html>
